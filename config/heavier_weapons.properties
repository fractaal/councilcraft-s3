# Heavier Weapons Configuration
# Changes apply without restarting the game

# Enable hitstop (animation freeze) on weapon impact
hitstopEnabled=true

# Hitstop duration in ticks for weapons without a category mapping
defaultHitstopTicks=4

# Extra hitstop ticks added on critical hits
critBonusTicks=4

# Delay in ticks after the attack connects before hitstop occurs (0 = immediate)
hitstopDelayTicks=0

# Scale the hitstop delay with the weapon's attack speed (slower weapons get a longer delay, 1 attack per second = unchanged)
scaleDelayWithAttackSpeed=false

# Hitstop duration per weapon category, format: category:ticks,category:ticks
categoryDurations=dagger:2,claw:2,fist:2,sickle:2,soul_knife:2,wand:2,rapier:3,sword:4,cutlass:4,katana:4,coral_blade:4,twin_blade:4,spear:4,trident:4,staff:4,pickaxe:4,axe:6,mace:7,glaive:6,scythe:6,battlestaff:6,lance:6,claymore:9,heavy_axe:9,double_axe:9,halberd:9,hammer:10,anchor:10,chakram:2,warglaive:4,bladestaff:4,spellbreaker:4,truthseeker:4,polearm:6,greataxe:9,greathammer:10

# Hitstop delay per weapon category, overrides hitstopDelayTicks, format: category:ticks,category:ticks
categoryDelays=

# Play a sound when hitstop occurs
hitstopSoundEnabled=true

# Sounds layered together for light hits (1 hitstop tick or less), any sound ids
hitstopSoundsLight=heavier_weapons:hitstop.light

# Sounds layered together for medium hits (2-3 hitstop ticks)
hitstopSoundsMedium=heavier_weapons:hitstop.medium,heavier_weapons:hitstop.crack

# Sounds layered together for heavy hits (4+ hitstop ticks)
hitstopSoundsHeavy=heavier_weapons:hitstop.heavy,heavier_weapons:hitstop.heavy_crack,heavier_weapons:hitstop.slam

# Hitstop sound volume multiplier
hitstopSoundVolume=1.0

# Hitstop sound pitch multiplier
hitstopSoundPitch=1.0

# Play the hitstop sound when the freeze starts after the delay instead of when the attack hits
hitstopSoundAfterDelay=false

# Enable camera shake on weapon impact
cameraShakeEnabled=true

# Camera shake intensity multiplier
cameraShakeIntensity=1.5

# Freeze hit entities in place during hitstop
entityFreezeEnabled=true

# Maximum ticks a hit entity stays frozen (-1 = same as the hitstop duration)
maxEntityFreezeTicks=-1

# Frozen entities shake in place along the hit direction before getting knocked back
entityShakeEnabled=true

# Entity shake intensity multiplier
entityShakeIntensity=3.0

# Hit entities stay in place while frozen and only get knocked back once the freeze ends
delayKnockback=true

# Entities that are never frozen or stunned, entity ids or #tags, format: #c:bosses,minecraft:warden
entityBlacklist=#c:bosses

# Stun mobs (stop their AI) once enough hits break their stagger threshold
stunEnabled=false

# Stun duration in ticks = hitstop ticks of the breaking hit x this
stunDurationMultiplier=3.0

# Stagger needed to stun a mob per point of max health, each hit adds its hitstop ticks as stagger (0 = every hit stuns)
staggerThresholdPerHealth=0.08

# Stagger threshold overrides per entity, format: minecraft:warden:40,minecraft:zombie:1
staggerThresholds=

# Stagger threshold increase per armor point (0.05 = full diamond doubles it)
armorStaggerResistance=0.05

# Stagger and stun multiplier when hitting a mob from behind or a mob that is not targeting you
backstabMultiplier=2.0

# Stun duration is divided by (1 + this x recent stuns), so repeated stuns get shorter (0 = no resistance)
stunResistancePerStun=0.5

# Ticks for one stack of stun resistance to wear off
stunResistanceDecayTicks=100

# Blocking a melee attack with a shield stuns the attacker, a disabled shield stuns the attacker and gives you hitstop and camera shake
shieldStunEnabled=false

# Attacker stun duration when you block
shieldBlockStunTicks=10

# Attacker stun duration when your shield is disabled
shieldBreakStunTicks=20

# Your hitstop duration when your shield is disabled
shieldBreakHitstopTicks=6

# Blocking right after raising a shield parries: longer attacker stun and damage vulnerability (also works with Sword Blocking Mechanics parries)
parryEnabled=false

# Ticks after the shield becomes active in which a block counts as a parry (Sword Blocking Mechanics uses its own window)
parryWindowTicks=4

# Attacker stun duration on parry
parryStunTicks=40

# Your hitstop duration on parry
parryHitstopTicks=4

# Ticks a parried attacker takes extra damage
parryVulnerabilityTicks=60

# Damage multiplier against a parried attacker
parryDamageMultiplier=1.5

# Enable Critical Strike mod compatibility (detect RNG crits for hitstop bonus)
criticalStrikeCompat=true
