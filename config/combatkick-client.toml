#Kick the camera when a melee attack hits
enabled = true
#Overall multiplier for every kick (also scaled by the vanilla Screen Effect Scale slider)
# Default: 1.0
# Range: 0.0 ~ 10.0
strength = 0.5
#Kick in degrees for a sword-weight hit; heavier (slower) weapons kick more, lighter ones less
# Default: 3.0
# Range: 0.0 ~ 30.0
kickDegrees = 3.0
#Cap on how far stacked kicks can push the camera, in degrees
# Default: 9.0
# Range: 0.0 ~ 45.0
maxDegrees = 9.0
#Sway speed in Hz: higher snaps back faster, lower sways longer
# Default: 2.2
# Range: 0.2 ~ 20.0
frequency = 2.2
#Damping ratio: 1.0 returns without overshoot, lower values overshoot and sway more
# Default: 0.35
# Range: 0.0 ~ 2.0
damping = 0.35
#Extra kick on critical (falling) hits
# Default: 1.6
# Range: 1.0 ~ 5.0
critMultiplier = 1.6
#Brief zoom toward the target on a sword-weight hit, as a fraction of FOV (0 disables)
# Default: 0.03
# Range: 0.0 ~ 0.3
fovPunch = 0.03
#true: the camera is dragged along with the swing; false: it recoils against it
followSwing = true
#Keep walking and sprinting during Heavier Weapons hitstop, which otherwise stops your movement input
keepMovementDuringHitstop = true
#Show a kill insignia at the bottom centre and ding when you kill a mob
killIcons = true
#Only count hostile mobs as kills
killOnlyHostile = true
#Volume of the kill ding (0 mutes it)
# Default: 0.6
# Range: 0.0 ~ 2.0
killSoundVolume = 0.6
#Size of the kill insignia
# Default: 1.0
# Range: 0.25 ~ 4.0
killIconScale = 1.0
#Height of the insignia's centre above the bottom of the screen, in GUI pixels
# Default: 140.0
# Range: 0.0 ~ 400.0
killIconHeight = 140.0
#Follow the ding with fading repeats, like an echo
killEcho = true
#With Physics Mod ragdolls, drive the body part your killing swing struck the way the swing was going
ragdollFling = true
#Speed given to the struck body part, in blocks per second, for a sword-weight kill; heavier weapons hit harder
# Default: 8.0
# Range: 0.0 ~ 40.0
ragdollFlingSpeed = 8.0
#After a first kill, another within this many seconds continues the streak (the xN counter).
#The insignia stays up for the same time, fading over the last second, and the combat report follows
# Default: 5.0
# Range: 1.0 ~ 300.0
killStreakMinSeconds = 5.0
#The streak window grows steadily with each kill up to this many seconds
# Default: 15.0
# Range: 1.0 ~ 300.0
killStreakMaxSeconds = 15.0
#Streak count at which the window reaches killStreakMaxSeconds
# Default: 20
# Range: 2 ~ 1000
killStreakMaxAt = 20
